<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#47512f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Controle de Lotes</title>
<style>
@font-face{font-family:'Lavish';src:url(fontes/lavish.otf) format('opentype');font-display:swap}
:root{--g1:#47512f;--g2:#dcdac8;--g3:#ecebdd;--off:#f5f3ea;--tx:#262a1c;--am:#e6b422;--ok:#4f7a4f;--al:#b07a1a;--er:#a33b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--off);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #bdbba5;border-radius:10px;background:#fff}
textarea{min-height:72px}
label{display:block;font-size:13px;color:#5b5d48;margin:12px 0 4px}
.btn{min-height:52px;padding:0 22px;border:0;border-radius:12px;background:var(--g1);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:var(--g2);color:var(--tx)}
.btn.er{background:var(--er)}
.btn[disabled]{opacity:.45}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
background:linear-gradient(rgba(22,30,12,.40),rgba(22,30,12,.64)),url(fundo.jpg) center/cover,radial-gradient(circle at 28% 18%,#6f7a52,#232b15 72%)}
.lbox{width:100%;max-width:400px;padding:32px 28px 26px;border-radius:30px;color:#fff;text-align:center;
background:rgba(205,222,160,.12);-webkit-backdrop-filter:blur(24px) saturate(125%);backdrop-filter:blur(24px) saturate(125%);
border:1px solid rgba(255,255,255,.28);box-shadow:0 24px 64px rgba(0,0,0,.38)}
.lbox img{width:68%;height:auto;margin:2px 0 14px}
.lbox h2{margin:6px 0 22px;font-family:'Lavish',Georgia,serif;font-size:42px;line-height:1.1;font-weight:400;letter-spacing:.5px}
.lbox h2 span{color:#d8dfb8}
.lbox select{min-height:54px;border-radius:999px;padding:0 22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.38);color:#fff;font-size:16px}
.lbox select option{color:#222}
.dots{font-size:26px;letter-spacing:9px;height:34px;margin:8px 0 8px;color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:264px;margin:0 auto}
.pad button,.pad i{min-height:46px;font-size:19px;border-radius:999px;font-style:normal}
.pad button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.10);color:#fff;cursor:pointer}
.pad button:active{background:rgba(255,255,255,.28)}
.entrar{display:block;width:100%;max-width:264px;min-height:50px;margin:16px auto 0;border:0;border-radius:999px;background:#f1efe2;color:#2b331a;font-size:17px;font-weight:600;cursor:pointer}
.nomes{display:grid;gap:12px;margin-top:4px}
.nome{min-height:56px;border-radius:999px;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.10);color:#fff;font-size:18px;cursor:pointer}
.nome:active{background:rgba(255,255,255,.26)}
.quem{display:flex;align-items:center;justify-content:center;gap:12px;font-size:19px;margin-bottom:2px}
.voltar{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.10);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.sem{color:#e6e9d2;font-size:14px}
/* topo */
header{position:sticky;top:0;z-index:5;background:var(--g1);color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.top b{flex:1;font-family:'Lavish',Georgia,serif;font-size:24px;font-weight:400;letter-spacing:.5px}
.sync{font-size:13px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.2);cursor:pointer}
.sync.pend{background:var(--al)}.sync.off{background:#2f341f}
nav{display:flex;overflow-x:auto;background:#353d22}
nav button{flex:0 0 auto;padding:13px 18px;border:0;background:none;color:#cfd3b6;font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-bottom-color:var(--am)}
main{padding:14px;max-width:980px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpi small{color:#666;display:block}.kpi strong{font-size:26px}
.kpi.al strong{color:var(--al)}.kpi.er strong{color:var(--er)}
.lote{cursor:pointer}
.lote h3{margin:0 0 2px;font-size:17px}.muted{color:#6a6c58;font-size:14px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--g3);margin:4px 4px 0 0}
.tag.al{background:#f1e2c2}.tag.er{background:#efcaca}.tag.ok{background:#d3e4d3}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--g3);text-align:left}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img,.thumbs .ph{width:92px;height:92px;object-fit:cover;border-radius:10px;background:var(--g2)}
.thumbs .ph{display:flex;align-items:center;justify-content:center;font-size:12px;color:#666}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mod{background:var(--off);width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 16px 20px}
.mh{position:sticky;top:0;background:var(--off);display:flex;align-items:center;padding:14px 0;gap:10px}
.mh b{flex:1;font-size:18px}
.x{width:44px;height:44px;border:0;border-radius:50%;background:var(--g2);font-size:22px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;display:none;max-width:90%}
.warn{color:var(--al);font-size:13px;margin-top:4px}
@media(min-width:700px){.ov{align-items:center}.mod{border-radius:18px}}
@media(max-width:440px){.lbox{padding:28px 22px 24px}.lbox h2{font-size:34px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
'use strict';
/* ===== CONFIG ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxNAKzpN-DJRvrmbyUVIiqCOpLNtdIq_yZ_a_hncZkdupgtZ-udWTVqT_CBiP0gRwpIPQ/exec';
const VERSAO_APP = '2.0.0';

/* ===== UTIL ===== */
const $ = (t, a = {}, ...k) => {
  const e = document.createElement(t);
  for (const [n, v] of Object.entries(a)) {
    if (n === 'class') e.className = v;
    else if (n.startsWith('on')) e.addEventListener(n.slice(2), v);
    else if (n === 'value') continue;
    else if (v === true) e.setAttribute(n, '');
    else if (v !== false && v != null) e.setAttribute(n, v);
  }
  k.flat(9).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(c)); });
  if (a.value !== undefined) e.value = a.value;
  return e;
};
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 12) : Math.random().toString(36).slice(2, 14));
const hojeISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const fData = s => { if (!s) return '-'; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1].slice(2)}` : s; };
const fNome = s => String(s).replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
const ddmmaa = () => { const d = hojeISO(); return `${d.slice(8)}-${d.slice(5, 7)}-${d.slice(2, 4)}`; };
const normT = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[º°ª]/g, '').replace(/\s+/g, ' ').trim();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
/* "8 andar" acha "8º andar", mas nao acha "18º andar" */
const bateLocal = (local, q) => { const n = normT(q); if (!n) return true; return new RegExp('(^|[^a-z0-9])' + escRe(n)).test(normT(local)); };
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2800); }

/* ===== IndexedDB (fila offline + copia local) ===== */
let _db;
function db() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('controle-lotes', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('fila', { keyPath: 'seq', autoIncrement: true }); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _db;
}
const tx = async (store, mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(store, mode); const r = fn(t.objectStore(store)); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));
const filaAdd = i => tx('fila', 'readwrite', s => s.add(i));
const filaAll = () => tx('fila', 'readonly', s => s.getAll()).then(r => r || []);
const filaDel = async seqs => { const d = await db(); return new Promise(res => { const t = d.transaction('fila', 'readwrite'); seqs.forEach(q => t.objectStore('fila').delete(q)); t.oncomplete = res; }); };

/* ===== ESTADO ===== */
const CHAVES = ['Materiais', 'Entregas', 'Fotos', 'Usuarios'];
const garantir = d => { d = d || {}; CHAVES.forEach(k => { if (!Array.isArray(d[k])) d[k] = []; }); return d; };
const S = { token: null, u: null, data: null, tab: 'entregar', pend: 0, erros: [], online: navigator.onLine, fotos: {}, filtro: { mat: '', q: '' } };
const NOMES = { entregar: 'Entregar', entregas: 'Entregas', relatorio: 'Relatório', cadastros: 'Cadastros', historico: 'Histórico' };
const TABS = {
  administrador: ['entregar', 'entregas', 'relatorio', 'cadastros', 'historico'],
  almoxarife: ['entregar', 'entregas', 'relatorio'],
  compras: ['entregas', 'relatorio', 'cadastros']
};

/* ===== API ===== */
async function api(acao, dados) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao, dados: dados || {}, token: S.token }) });
  return r.json();
}

/* ===== MODELO LOCAL ===== */
function aplicar(data, acao, d) {
  const up = (nome, obj) => { const l = data[nome]; const i = l.findIndex(x => x.id === obj.id); if (i < 0) l.push(obj); else l[i] = Object.assign(l[i], obj); };
  const por = S.u ? S.u.nome : '';
  switch (acao) {
    case 'salvarEntrega': up('Entregas', Object.assign({ por, criadoEm: new Date().toISOString() }, d)); break;
    case 'salvarFoto': if (!data.Fotos.some(f => f.id === d.id)) data.Fotos.push({ id: d.id, refTipo: d.refTipo, refId: d.refId, tipo: d.tipo, arquivo: 'local', por }); break;
    case 'salvarCadastro': up('Materiais', Object.assign({ ativo: 'sim' }, d)); break;
    case 'salvarUsuario': up('Usuarios', { id: d.id, nome: d.nome, perfil: d.perfil, ativo: d.ativo || 'sim' }); break;
  }
}
async function enfileirar(acao, dados) {
  await filaAdd({ acao, dados });
  aplicar(S.data, acao, dados);
  await kvSet('data', S.data);
  await atualizarPend();
}
async function atualizarPend() { S.pend = (await filaAll()).length; barra(); }

let syncing = false, denovo = false;
async function sincronizar() {
  if (!S.online || !S.token || API_URL.startsWith('COLE')) return;
  if (syncing) { denovo = true; return; }
  syncing = true; barra();
  try {
    for (;;) {
      const itens = await filaAll(); if (!itens.length) break;
      const grupo = itens.slice(0, 6);
      const r = await api('batch', { passos: grupo.map(i => ({ acao: i.acao, dados: i.dados })) });
      if (!r.ok) { if (r.sessao) sairLogin(); break; }
      const del = [];
      r.resultados.forEach((x, k) => {
        if (x.ok) del.push(grupo[k].seq);
        else if (!x.repetir) { S.erros.push({ acao: grupo[k].acao, erro: x.erro }); del.push(grupo[k].seq); }
      });
      await filaDel(del);
      if (del.length < grupo.length) break;
    }
    await recarregar(true);
  } catch (e) { /* sem rede: tenta depois */ }
  finally { syncing = false; await atualizarPend(); if (denovo) { denovo = false; sincronizar(); } }
}
async function recarregar(silencioso) {
  const r = await api('carregar');
  if (!r.ok) { if (r.sessao) sairLogin(); return; }
  const data = garantir({}); CHAVES.forEach(t => data[t] = r[t] || []);
  (await filaAll()).forEach(i => aplicar(data, i.acao, i.dados));
  S.data = data; await kvSet('data', data);
  if (!silencioso || !document.querySelector('.ov')) render();
}

/* ===== FOTOS ===== */
function comprimir(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const m = 1400, esc = Math.min(1, m / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * esc); c.height = Math.round(img.height * esc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => rej(new Error('imagem')); img.src = url;
  });
}
function fotoCampo(rotulo, lista) {
  const box = $('div'), th = $('div', { class: 'thumbs' });
  const pinta = () => { th.replaceChildren(...lista.map((u, i) => $('div', { style: 'position:relative' }, $('img', { src: u }), $('button', { class: 'x', type: 'button', style: 'position:absolute;top:-6px;right:-6px;width:30px;height:30px;font-size:16px', onclick: () => { lista.splice(i, 1); pinta(); } }, '×')))); };
  const mk = cap => { const i = $('input', { type: 'file', accept: 'image/*', multiple: true, style: 'display:none', onchange: async () => { for (const f of i.files) { try { lista.push(await comprimir(f)); } catch (e) { toast('Foto inválida'); } } i.value = ''; pinta(); } }); if (cap) i.setAttribute('capture', 'environment'); return i; };
  const cam = mk(true), gal = mk(false);
  box.append($('label', {}, rotulo), $('div', { class: 'row' }, $('button', { class: 'btn', type: 'button', onclick: () => cam.click() }, 'Câmera'), $('button', { class: 'btn sec', type: 'button', onclick: () => gal.click() }, 'Galeria')), cam, gal, th);
  return box;
}
async function urlFoto(id) {
  if (S.fotos[id]) return S.fotos[id];
  const f = (await filaAll()).find(i => i.acao === 'salvarFoto' && i.dados.id === id);
  if (f) return S.fotos[id] = f.dados.base64;
  const r = await api('obterFoto', { id });
  if (!r.ok) throw new Error(r.erro);
  return S.fotos[id] = r.dataUrl;
}
function thumbs(refId) {
  const lista = S.data.Fotos.filter(f => f.refTipo === 'entrega' && f.refId === refId);
  const box = $('div', { class: 'thumbs' });
  if (!lista.length) box.append($('div', { class: 'ph' }, 'sem foto'));
  lista.forEach(f => {
    const ph = $('div', { class: 'ph' }, '…'); box.append(ph);
    urlFoto(f.id).then(u => { ph.replaceWith($('img', { src: u, onclick: () => ampliar(u) })); }).catch(() => { ph.textContent = 'offline'; });
  });
  return box;
}
function ampliar(u) { modal('Foto', $('img', { src: u, style: 'width:100%;border-radius:12px' })); }

/* ===== MODAL (fecha so pelo X) ===== */
function modal(titulo, corpo) {
  const ov = $('div', { class: 'ov' });
  const fechar = () => { ov.remove(); };
  ov.append($('div', { class: 'mod' }, $('div', { class: 'mh' }, $('b', {}, titulo), $('button', { class: 'x', onclick: fechar }, '×')), corpo));
  document.body.append(ov); return fechar;
}

/* ===== DADOS ===== */
const mat = id => S.data.Materiais.find(m => m.id === id) || { nome: '?' };
const unicos = campo => [...new Set(S.data.Entregas.map(e => (e[campo] || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
const ordena = l => l.slice().sort((a, b) => (b.data || '').localeCompare(a.data || '') || (b.criadoEm || '').localeCompare(a.criadoEm || ''));
const nFotos = id => S.data.Fotos.filter(f => f.refTipo === 'entrega' && f.refId === id).length;
const datalist = (id, itens) => $('datalist', { id }, itens.map(v => $('option', { value: v })));
const filtrar = o => S.data.Entregas.filter(e => (!o.mat || e.materialId === o.mat) && bateLocal(e.local, o.local) && (!o.de || (e.data || '') >= o.de) && (!o.ate || (e.data || '') <= o.ate));

/* ===== LOGIN ===== */
async function telaLogin() {
  const app = document.getElementById('app'); app.replaceChildren();
  let pin = '', usuario = null, usuarios = (await kvGet('usuarios')) || [];
  const caixa = $('div', { class: 'lbox' }); app.append($('div', { id: 'login' }, caixa));
  const cab = () => [$('img', { src: 'logo.png', onerror: e => e.target.remove(), alt: '' }), $('h2', {}, 'Controle de ', $('span', {}, 'Lotes'))];
  function passo1() {
    usuario = null; pin = '';
    caixa.replaceChildren(...cab(), usuarios.length
      ? $('div', { class: 'nomes' }, usuarios.map(u => $('button', { class: 'nome', type: 'button', onclick: () => { usuario = u; passo2(); } }, u.nome)))
      : $('div', { class: 'sem' }, 'Sem conexão'));
  }
  function passo2() {
    pin = '';
    const dots = $('div', { class: 'dots' }, ' ');
    const pinta = () => { dots.textContent = pin ? '●'.repeat(pin.length) : ' '; };
    const entrar = async () => {
      if (!pin) return;
      try {
        const r = await api('login', { usuarioId: usuario.id, pin });
        if (!r.ok) { toast(r.erro); pin = ''; pinta(); return; }
        S.token = r.token; S.u = r.usuario; await kvSet('sessao', { token: r.token, u: r.usuario });
        S.data = null; S.tab = TABS[r.usuario.perfil][0]; await iniciar();
      } catch (e) { toast('Sem conexão'); }
    };
    const tecla = n => $('button', { type: 'button', onclick: () => { if (pin.length < 8) { pin += n; pinta(); } } }, n);
    caixa.replaceChildren(...cab(),
      $('div', { class: 'quem' }, $('button', { class: 'voltar', type: 'button', 'aria-label': 'voltar', onclick: passo1 }, '‹'), $('span', {}, usuario.nome)), dots,
      $('div', { class: 'pad' }, [1, 2, 3, 4, 5, 6, 7, 8, 9].map(tecla), $('i'), tecla(0), $('button', { type: 'button', 'aria-label': 'apagar', onclick: () => { pin = pin.slice(0, -1); pinta(); } }, '⌫')),
      $('button', { class: 'entrar', type: 'button', onclick: entrar }, 'Entrar'));
  }
  passo1();
  if (S.online && !API_URL.startsWith('COLE')) api('usuariosLogin').then(r => { if (r.ok) { usuarios = r.usuarios; kvSet('usuarios', usuarios); if (!usuario) passo1(); } }).catch(() => {});
}
async function sairLogin() { S.token = null; S.u = null; await kvSet('sessao', null); telaLogin(); }

/* ===== TELAS ===== */
function render() {
  if (!S.u || !S.data) return;
  const app = document.getElementById('app'); app.replaceChildren();
  const tabs = TABS[S.u.perfil] || [];
  if (!tabs.includes(S.tab)) S.tab = tabs[0];
  app.append($('header', {},
    $('div', { class: 'top' }, $('b', {}, 'Controle de Lotes'), $('span', { class: 'sync', id: 'sync', onclick: () => { sincronizar(); if (S.erros.length) mostrarErros(); } }), $('span', { style: 'font-size:13px' }, S.u.nome), $('button', { class: 'btn sec sm', onclick: () => sairLogin() }, 'Sair')),
    $('nav', {}, tabs.map(k => $('button', { class: S.tab === k ? 'on' : '', onclick: () => { S.tab = k; render(); } }, NOMES[k])))));
  const main = $('main'); app.append(main);
  ({ entregar, entregas, relatorio, cadastros, historico })[S.tab](main);
  barra();
}
function barra() {
  const e = document.getElementById('sync'); if (!e) return;
  e.className = 'sync' + (!S.online ? ' off' : S.pend ? ' pend' : '');
  e.textContent = !S.online ? (S.pend ? `offline · ${S.pend}` : 'offline') : S.pend ? `${S.pend} aguardando` : S.erros.length ? `${S.erros.length} erro(s)` : '● ok';
}
function mostrarErros() { modal('Erros de envio', $('div', {}, S.erros.map(e => $('p', {}, `${e.acao}: ${e.erro}`)), $('button', { class: 'btn', onclick: () => { S.erros = []; barra(); } }, 'Limpar'))); }

/* --- Entregar (almoxarife) --- */
function entregar(m, ed) {
  const f = { mat: ed ? ed.materialId : '', local: ed ? ed.local : '', retirou: ed ? ed.retiradoPor : '', data: ed ? ed.data : hojeISO() };
  const fotos = [];
  const ativos = S.data.Materiais.filter(x => x.ativo !== 'nao' || (ed && x.id === ed.materialId));
  const selM = $('select', { onchange: e => f.mat = e.target.value }, $('option', { value: '' }, 'Material'), ativos.map(x => $('option', { value: x.id }, x.nome)));
  selM.value = f.mat;
  const inp = (rot, k, extra = {}) => $('div', {}, $('label', {}, rot), $('input', Object.assign({ value: f[k], oninput: e => f[k] = e.target.value }, extra)));
  const bt = $('button', { class: 'btn', style: 'width:100%;margin-top:18px', onclick: async () => {
    if (!f.mat) return toast('Escolha o material');
    if (!f.local.trim()) return toast('Informe para onde vai');
    if (!f.retirou.trim()) return toast('Informe quem retirou');
    if (!ed && !fotos.length) return toast('Foto do lote é obrigatória');
    bt.disabled = true;
    const id = ed ? ed.id : uid();
    await enfileirar('salvarEntrega', { id, materialId: f.mat, local: f.local.trim(), retiradoPor: f.retirou.trim(), data: f.data, obs: ed ? ed.obs || '' : '' });
    for (const b of fotos) await enfileirar('salvarFoto', { id: uid(), refTipo: 'entrega', refId: id, tipo: 'lote', base64: b });
    toast(ed ? 'Entrega atualizada' : 'Entrega salva');
    if (ed) { ed._fechar(); }
    render(); sincronizar();
  } }, ed ? 'Salvar alterações' : 'Salvar entrega');
  m.append($('div', { class: 'card' }, $('label', {}, 'Material'), selM,
    inp('Para onde vai ser usado', 'local', { list: 'locais', placeholder: 'ex.: 8º andar, fachada torre A' }),
    inp('Quem retirou', 'retirou', { list: 'pessoas' }), inp('Data', 'data', { type: 'date' }),
    ed ? null : fotoCampo('Foto do lote *', fotos), bt), datalist('locais', unicos('local')), datalist('pessoas', unicos('retiradoPor')));
}

/* --- Entregas (lista) --- */
function entregas(m) {
  const F = S.filtro;
  const selM = $('select', { onchange: e => { F.mat = e.target.value; pinta(); } }, $('option', { value: '' }, 'Todos os materiais'), S.data.Materiais.map(x => $('option', { value: x.id }, x.nome)));
  selM.value = F.mat;
  const lista = $('div');
  m.append($('div', { class: 'row', style: 'margin-bottom:12px' }, selM, $('input', { placeholder: 'Buscar local ou pessoa', value: F.q, oninput: e => { F.q = e.target.value; pinta(); } })), lista);
  function pinta() {
    const q = normT(F.q);
    const ls = ordena(S.data.Entregas.filter(e => (!F.mat || e.materialId === F.mat) && (!q || normT(e.local + ' ' + e.retiradoPor + ' ' + mat(e.materialId).nome).includes(q)))).slice(0, 200);
    lista.replaceChildren(...(ls.length ? ls.map(e => $('div', { class: 'card lote', onclick: () => detalhe(e.id) },
      $('h3', {}, mat(e.materialId).nome), $('div', { class: 'muted' }, `${fData(e.data)} · ${e.local}`), $('div', { class: 'muted' }, `Retirado por ${e.retiradoPor}`),
      nFotos(e.id) ? null : $('span', { class: 'tag er' }, 'sem foto'))) : [$('div', { class: 'muted' }, 'Nenhuma entrega')]));
  }
  pinta();
}
function detalhe(id) {
  const e = S.data.Entregas.find(x => x.id === id); if (!e) return;
  const corpo = $('div'); let fechar;
  corpo.append($('div', { class: 'card' }, $('h3', { style: 'margin:0 0 4px' }, mat(e.materialId).nome), $('div', {}, `${fData(e.data)} · ${e.local}`), $('div', { class: 'muted' }, `Retirado por ${e.retiradoPor} · registrado por ${e.por || '-'}`), thumbs(e.id)),
    $('div', { class: 'row' }, $('button', { class: 'btn', onclick: () => gerarPDF({ ids: [e.id], fotos: true }) }, 'PDF'),
      S.u.perfil === 'administrador' ? $('button', { class: 'btn sec', onclick: () => { fechar(); editar(e); } }, 'Editar') : null));
  fechar = modal('Entrega', corpo);
}
function editar(e) {
  const corpo = $('div'); const fechar = modal('Editar entrega', corpo);
  entregar(corpo, Object.assign({}, e, { _fechar: fechar }));
}

/* --- Relatorio --- */
function relatorio(m) {
  const R = { mat: '', local: '', de: '', ate: '', fotos: true };
  const cont = $('div', { class: 'muted', style: 'margin-top:12px' });
  const atualiza = () => { const n = filtrar(R).length; cont.textContent = n === 1 ? '1 entrega encontrada' : `${n} entregas encontradas`; bt.disabled = !n; };
  const selM = $('select', { onchange: e => { R.mat = e.target.value; atualiza(); } }, $('option', { value: '' }, 'Todos os materiais'), S.data.Materiais.map(x => $('option', { value: x.id }, x.nome)));
  const bt = $('button', { class: 'btn', style: 'width:100%;margin-top:16px', onclick: async () => {
    bt.disabled = true; bt.textContent = 'Gerando…';
    try { await gerarPDF(Object.assign({}, R)); } catch (e) { toast('Erro: ' + e.message); }
    bt.textContent = 'Gerar PDF'; atualiza();
  } }, 'Gerar PDF');
  m.append($('div', { class: 'card' }, $('label', {}, 'Material'), selM,
    $('label', {}, 'Local'), $('input', { list: 'locais', placeholder: 'ex.: 8º andar', oninput: e => { R.local = e.target.value; atualiza(); } }),
    $('div', { class: 'row' }, $('div', {}, $('label', {}, 'De'), $('input', { type: 'date', oninput: e => { R.de = e.target.value; atualiza(); } })), $('div', {}, $('label', {}, 'Até'), $('input', { type: 'date', oninput: e => { R.ate = e.target.value; atualiza(); } }))),
    $('label', { style: 'display:flex;gap:10px;align-items:center;color:var(--tx);font-size:16px' }, $('input', { type: 'checkbox', checked: true, style: 'width:24px;min-height:24px', onchange: e => R.fotos = e.target.checked }), 'Com fotos'), cont, bt), datalist('locais', unicos('local')));
  atualiza();
}

const dimsImg = u => new Promise(r => { const i = new Image(); i.onload = () => r([i.width, i.height]); i.onerror = () => r([4, 3]); i.src = u; });
async function logoDataUrl() { try { const b = await (await fetch('logo.png')).blob(); if (!b.type.startsWith('image/')) return null; return await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); }); } catch (e) { return null; } }

async function gerarPDF(o) {
  if (!window.jspdf) return toast('PDF indisponível offline');
  const lista = (o.ids ? S.data.Entregas.filter(e => o.ids.includes(e.id)) : filtrar(o))
    .sort((a, b) => normT(a.local).localeCompare(normT(b.local), 'pt-BR', { numeric: true }) || (a.data || '').localeCompare(b.data || ''));
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const W = 210, H = 297, M = 14; let y = 30;
  const logo = await logoDataUrl(); let logoR = 0.17; if (logo) { const [lw, lh] = await dimsImg(logo); logoR = lh / lw; }
  const nova = () => { doc.addPage(); y = 30; };
  const cabeca = () => { doc.setFillColor(63, 74, 43); doc.rect(0, 0, W, 20, 'F'); doc.setTextColor(255); doc.setFontSize(13); doc.text('Controle de Lotes', M, 13); if (logo) { try { doc.addImage(logo, 'PNG', W - M - 42, 7, 42, 42 * logoR, undefined, 'FAST'); } catch (e) { } } doc.setTextColor(40); };
  const garante = h => { if (y + h > H - 18) nova(); };
  const txt = (t, tam = 10, neg = false) => { doc.setFontSize(tam); doc.setFont('helvetica', neg ? 'bold' : 'normal'); doc.splitTextToSize(String(t), W - 2 * M).forEach(l => { garante(tam * 0.5); doc.text(l, M, y); y += tam * 0.45 + 1.2; }); };
  const fotos = async id => {
    const fs = S.data.Fotos.filter(f => f.refTipo === 'entrega' && f.refId === id);
    if (!o.fotos || !fs.length) return;
    let x = M; const larg = 56, alt = 42;
    for (const f of fs) {
      let u; try { u = await urlFoto(f.id); } catch (e) { continue; }
      if (x + larg > W - M + 1) { x = M; y += alt + 4; }
      garante(alt + 6);
      const [iw, ih] = await dimsImg(u); const e = Math.min(larg / iw, alt / ih);
      try { doc.addImage(u, 'JPEG', x, y, iw * e, ih * e, undefined, 'FAST'); } catch (er) { }
      x += larg + 4;
    }
    y += alt + 6;
  };
  cabeca();
  const unica = o.ids && lista.length === 1;
  txt(unica ? 'Entrega de material' : 'Relatório de entregas', 15, true);
  txt(`Emitido em ${fData(hojeISO())} por ${S.u.nome}`, 9);
  const filtros = [o.mat ? 'Material: ' + mat(o.mat).nome : null, o.local ? 'Local: ' + o.local : null, o.de ? 'De ' + fData(o.de) : null, o.ate ? 'Até ' + fData(o.ate) : null].filter(Boolean);
  if (filtros.length) txt(filtros.join(' · '), 9);
  y += 3;
  let ultimo = null;
  for (const e of lista) {
    if (!unica && normT(e.local) !== ultimo) { ultimo = normT(e.local); garante(24); y += 2; txt(e.local, 12, true); }
    garante(30);
    txt(`${fData(e.data)} · ${mat(e.materialId).nome}`, 10, true);
    txt(`${unica ? 'Local: ' + e.local + ' · ' : ''}Retirado por ${e.retiradoPor} · registrado por ${e.por || '-'}`, 9);
    await fotos(e.id);
    y += 3;
  }
  if (!lista.length) txt('Nenhuma entrega encontrada.', 10);
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); if (i > 1) cabeca(); doc.setFontSize(8); doc.setTextColor(110); doc.text(`Página ${i} de ${n}`, W - M, H - 8, { align: 'right' }); doc.text('Controle de Lotes', M, H - 8); doc.setTextColor(40); }
  const base = unica ? 'ENTREGA' : 'ENTREGAS';
  doc.save(`${base} - ${fNome(o.mat ? mat(o.mat).nome : unica ? mat(lista[0].materialId).nome : 'todos os materiais')} - ${fNome(o.local || (unica ? lista[0].local : 'todos os locais'))} - ${ddmmaa()}.pdf`);
}

/* --- Cadastros --- */
function cadastros(m) {
  const linha = (t, f) => $('div', { style: 'padding:10px 0;border-bottom:1px solid var(--g3);cursor:pointer', onclick: f }, t);
  const bloco = (titulo, itens, novo) => $('div', { class: 'card' }, $('div', { class: 'row', style: 'align-items:center' }, $('b', {}, titulo), $('button', { class: 'btn sm', style: 'flex:0 0 auto', onclick: novo }, '+')), itens);
  m.append(bloco('Materiais', S.data.Materiais.map(x => linha(x.nome + (x.ativo === 'nao' ? ' (inativo)' : ''), () => formMat(x))), () => formMat(null)));
  if (S.u.perfil === 'administrador') m.append(bloco('Usuários', S.data.Usuarios.map(x => linha(`${x.nome} · ${x.perfil}${x.ativo === 'nao' ? ' (inativo)' : ''}`, () => formUsu(x))), () => formUsu(null)));
}
function formMat(x) {
  const f = Object.assign({ id: uid(), nome: '', ativo: 'sim' }, x || {}); let fechar;
  const ativo = $('select', { onchange: e => f.ativo = e.target.value }, $('option', { value: 'sim' }, 'Ativo'), $('option', { value: 'nao' }, 'Inativo')); ativo.value = f.ativo;
  fechar = modal(x ? 'Editar material' : 'Novo material', $('div', {}, $('label', {}, 'Nome'), $('input', { value: f.nome, oninput: e => f.nome = e.target.value }), $('label', {}, 'Situação'), ativo,
    $('button', { class: 'btn', style: 'width:100%;margin-top:14px', onclick: async () => { if (!f.nome.trim()) return toast('Nome'); await enfileirar('salvarCadastro', { id: f.id, nome: f.nome.trim(), ativo: f.ativo }); fechar(); sincronizar(); render(); } }, 'Salvar')));
}
function formUsu(x) {
  const f = Object.assign({ id: 'u-' + uid(), nome: '', perfil: 'almoxarife', ativo: 'sim', pin: '' }, x || {}); let fechar;
  const perfil = $('select', { onchange: e => f.perfil = e.target.value }, ['administrador', 'almoxarife', 'compras'].map(p => $('option', { value: p }, p))); perfil.value = f.perfil;
  const ativo = $('select', { onchange: e => f.ativo = e.target.value }, $('option', { value: 'sim' }, 'Ativo'), $('option', { value: 'nao' }, 'Inativo')); ativo.value = f.ativo;
  fechar = modal(x ? 'Editar usuário' : 'Novo usuário', $('div', {}, $('label', {}, 'Nome'), $('input', { value: f.nome, oninput: e => f.nome = e.target.value }), $('label', {}, 'Perfil'), perfil, $('label', {}, 'Situação'), ativo,
    $('label', {}, x ? 'Nova senha (vazio = manter)' : 'Senha (4 a 8 números)'), $('input', { type: 'password', inputmode: 'numeric', pattern: '[0-9]*', oninput: e => f.pin = e.target.value.replace(/\D/g, '') }),
    $('button', { class: 'btn', style: 'width:100%;margin-top:14px', onclick: async () => { if (!f.nome.trim()) return toast('Nome'); if ((!x || f.pin) && !/^\d{4,8}$/.test(f.pin)) return toast('Senha: 4 a 8 números'); await enfileirar('salvarUsuario', f); fechar(); sincronizar(); render(); } }, 'Salvar')));
}
async function historico(m) {
  m.append($('div', { class: 'muted' }, 'Carregando…'));
  try {
    const r = await api('historico');
    m.replaceChildren($('div', { class: 'card' }, r.ok ? $('table', {}, r.itens.map(h => $('tr', {}, $('td', {}, h.quando.replace('T', ' ').slice(0, 16)), $('td', {}, h.quem), $('td', {}, h.acao), $('td', {}, h.detalhe)))) : r.erro));
  } catch (e) { m.replaceChildren($('div', { class: 'muted' }, 'Sem conexão')); }
}

/* ===== INICIO ===== */
async function iniciar() {
  if (!S.data) S.data = (await kvGet('data')) || null;
  if (S.data) S.data = garantir(S.data);
  await atualizarPend();
  if (S.data) render();
  else document.getElementById('app').replaceChildren($('main', {}, $('div', { class: 'muted' }, 'Carregando…')));
  if (S.online && !API_URL.startsWith('COLE')) { try { await sincronizar(); if (!S.data || !S.data.Entregas) await recarregar(); else if (!S.pend) await recarregar(true); } catch (e) { } }
  else if (!S.data) toast('Sem dados locais');
}
window.addEventListener('online', () => { S.online = true; barra(); sincronizar(); });
window.addEventListener('offline', () => { S.online = false; barra(); });
setInterval(sincronizar, 30000);
(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  const ses = await kvGet('sessao');
  if (ses && ses.token && TABS[ses.u && ses.u.perfil]) { S.token = ses.token; S.u = ses.u; S.tab = TABS[ses.u.perfil][0]; await iniciar(); }
  else telaLogin();
})();
